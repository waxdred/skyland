# Skyland default config, translated from 43PR/dotfiles (.config/hypr/*.lua)
# SUPER is split: cmd for navigation (macOS muscle memory), alt where cmd
# would shadow a system shortcut (cmd-t, cmd-q, cmd-f, cmd-space).
#
# Not portable yet (skyland roadmap): blur, shadow.

config-version = 2
start-at-login = false
auto-reload-config = true

# 43PR: layout = "dwindle" (new window splits the focused one along its longest side)
dwindle = true
# 43PR/Hyprland dwindle:smart_split: the new window goes on the side of the cursor
dwindle-smart-split = true
# 43PR SUPER+Space: a tile made floating is resized to 70% of the monitor and centered
floating-center-percent = 70
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
enable-normalization-flatten-containers = true
# off: dwindle picks orientation from the window aspect, don't flip it
enable-normalization-opposite-orientation-for-nested-containers = false

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
focus-follows-mouse.enabled = true # 43PR: follow_mouse = 1
# Hyprland warps the cursor to a window focused from the keyboard (cursor:no_warps
# = false); without it the cursor stays over the old window and focus-follows-mouse
# gives focus back to it on the next mouse move. 'lazy': no warp if already inside.
on-focus-changed = ['move-mouse window-lazy-center', 'exec-and-forget sketchybar --trigger skyland_update']
# sketchybar workspaces + window title (profiles/hypr/sketchybar/)
exec-on-workspace-change = ['/bin/bash', '-c', 'sketchybar --trigger skyland_update']

# 43PR: workspaces 1-4 persistent
persistent-workspaces = ["1", "2", "3", "4"]

key-mapping.preset = 'qwerty'
# French AZERTY keyboard: AeroSpace reads keys by their QWERTY position, so
# letters that move are remapped to their AZERTY label (physical keys, so it
# also holds when the input layout is switched to QWERTY).
key-mapping.key-notation-to-key-code = { a = 'q', q = 'a', z = 'w', w = 'z', m = 'semicolon' }

# 43PR: gaps_in = 4, gaps_out = { top 5, right 8, bottom 8, left 8 }
# sketchybar (32px) overlays the macOS menu bar, which macOS already reserves
gaps.inner.horizontal = 4
gaps.inner.vertical = 4
gaps.outer.top = 5
gaps.outer.right = 8
gaps.outer.bottom = 8
gaps.outer.left = 8

# 43PR: rounding = 8, opacity 1.0 override (inactive dimmed here to test the
# scripting addition, set 100 for the exact 43PR look). Needs `skyland-sa load`.
[decoration]
rounding = 8
active-opacity = 100
inactive-opacity = 85

# 43PR: bezier easeOut 0.05,0.9,0.1,1.0; windows speed 5 (500 ms), workspaces
# speed 6 (600 ms) with the "default" curve, style slidefadevert; fade speed 4.
# Hyprland speed is in ds (1 = 100 ms). Needs the payload: skyland-sa build/load.
[animations]
enabled = true
windows-ms = 500
windows-bezier = '0.05, 0.9, 0.1, 1.0'
workspaces-ms = 600
workspaces-bezier = '0.0, 0.75, 0.15, 1.0'
fade-ms = 400
fade-bezier = '0.0, 0.75, 0.15, 1.0'

# 43PR themes as GTK colors.css files (`@define-color key #rrggbb;`), applied
# to sketchybar and Ghostty by bin/skyland-theme. All 18 43PR presets are in
# ~/.config/skyland/themes; copy one to customize.
[theme]
dark = '~/.config/skyland/themes/43pr-catppuccin-mocha.css' # 43pr-default.css: the original pure black
light = '~/.config/skyland/themes/43pr-white.css'

# 43PR wallpaper picker (alt-w) and wallpaper-based colors (matugen, 43PR roles in
# ~/.config/skyland/wallpaper-colors.json). `skyland-wallpaper fetch` downloads
# the 43PR wallhaven uploads into dir.
[wallpaper]
dir = '~/Pictures/Wallpapers'
dynamic-colors = true
prefer = 'saturation'

# hyprlock-like screen saver (bin/skyland-lock): blurred wallpaper, glassy clock
# in the current theme. alt-tab starts it (43PR SUPER+Tab); macOS asks the password.
[lock]
name = 'Waxcoin'
hint = 'Mot de passe'
blur = 12 # wallpaper blur radius, 0 = sharp

[mode.main.binding]
# programs
alt-t = 'exec-and-forget open -n -a Ghostty'
alt-enter = 'exec-and-forget open -n -a Ghostty'
cmd-e = 'exec-and-forget open -a Finder'
cmd-b = 'exec-and-forget open -a "Brave Browser"'

# window
alt-q = 'close'
alt-f = 'fullscreen --no-outer-gaps' # 43PR: fullscreen mode 0
alt-space = 'layout floating tiling' # 43PR SUPER+Space: float at 70%, centered
alt-j = 'layout tiles horizontal vertical' # Hyprland togglesplit (flip the focused split)
alt-l = 'exec-and-forget ~/code/hyperland/skyland/bin/skyland-theme toggle' # 43PR SUPER+L light/dark
alt-w = 'exec-and-forget ~/code/hyperland/skyland/bin/skyland-wallpaper pick' # 43PR SUPER+W
alt-tab = 'exec-and-forget ~/code/hyperland/skyland/bin/skyland-lock now' # 43PR SUPER+Tab (hyprlock)

# focus / move / resize (h j k l)
cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'
cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'
cmd-alt-h = 'resize width -40'
cmd-alt-l = 'resize width +40'
cmd-alt-k = 'resize height -40'
cmd-alt-j = 'resize height +40'
cmd-alt-e = 'balance-sizes'

# workspaces 1-10
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 10'
cmd-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
cmd-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
cmd-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
cmd-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
cmd-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
cmd-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
cmd-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
cmd-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
cmd-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
cmd-shift-0 = 'move-node-to-workspace --focus-follows-window 10'
cmd-left = 'workspace prev'
cmd-right = 'workspace next'

# 43PR: SUPER+SHIFT+E exit, here back to the work profile
cmd-shift-e = 'exec-and-forget ~/code/hyperland/skyland/bin/skyland-env work'
