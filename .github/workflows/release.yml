# On a v* tag: build skyland on macOS and publish the repo with its binaries, so
# `bin/skyland-install` skips the Swift toolchain and the build (.build/PREBUILT).
# The Dock payload (arm64e, SIP off only) is still built on the user's Mac.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Tools
        run: |
          brew install swiftly cmake jq
          swiftly init --assume-yes --skip-install --quiet-shell-followup
          . ~/.swiftly/env.sh
          swiftly install "$(cat .swift-version)"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
      - name: Build (ad-hoc signed, skyland install re-signs it locally)
        run: |
          bin/skyland-build
          echo "${GITHUB_REF_NAME}" > .build/PREBUILT
      - name: Package
        run: |
          name="skyland-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name/.build/debug"
          git ls-files --recurse-submodules | grep -v '^docs/screenshots/' | tar -cf - -T - | tar -xf - -C "dist/$name"
          cp -R .build/Skyland.app .build/PREBUILT .build/skyland-* "dist/$name/.build/"
          cp .build/aerospace "dist/$name/.build/"
          # ponytail: old path of the CLI (sketchybar items of a previous version call it
          # until the bar is rebuilt), drop after a couple of versions
          cp .build/aerospace "dist/$name/.build/debug/"
          cp -R .build/mediaremote "dist/$name/.build/"
          (cd dist && zip -qry "$name.zip" "$name")
      - name: Release notes (CHANGELOG.md section of the tag)
        run: |
          awk -v tag="## ${GITHUB_REF_NAME}" '$0 == tag { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "See [CHANGELOG.md](https://github.com/waxdred/skyland/blob/main/CHANGELOG.md)." > dist/notes.md
          printf '\n**Install:** `brew install waxdred/tap/skyland && skyland install`, or download the zip and run `bin/skyland-install`.\n' >> dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/skyland-${{ github.ref_name }}.zip
          body_path: dist/notes.md
      - name: Update the Homebrew tap (waxdred/homebrew-tap)
        # needs the HOMEBREW_TAP_TOKEN secret: a fine-grained token with Contents
        # read / write on waxdred/homebrew-tap only; skipped without it
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "no HOMEBREW_TAP_TOKEN secret: tap not updated"; exit 0; }
          version="${GITHUB_REF_NAME#v}"
          sha="$(shasum -a 256 "dist/skyland-${GITHUB_REF_NAME}.zip" | cut -d' ' -f1)"
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/waxdred/homebrew-tap.git" tap
          cd tap
          sed -i '' -E \
            -e "s|releases/download/v[^/]+/skyland-v[^\"]+\.zip|releases/download/${GITHUB_REF_NAME}/skyland-${GITHUB_REF_NAME}.zip|" \
            -e "s|sha256 \"[0-9a-f]{64}\"|sha256 \"${sha}\"|" Formula/skyland.rb
          git diff --quiet && { echo "formula already up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "skyland ${version}"
          git push -q
